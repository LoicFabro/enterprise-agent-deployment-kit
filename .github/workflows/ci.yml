name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: eadk validate --tenant acme --env staging
      - run: eadk validate --tenant acme --env production
      - run: eadk plan --tenant acme --env staging
      - run: eadk deploy --tenant acme --env staging
      - run: eadk impact --tool create_ticket
